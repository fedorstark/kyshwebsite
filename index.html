
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KYSH Online</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <div class="logo">
            <img src="images/logo.png" alt="Logo">
        </div>

        <div class="header-right">
            <button class="language">
                <img src="images/language.png" alt="">
                RUS
            </button>

            <button class="login" onclick="showMessage('Вход в аккаунт')">
                Войти
            </button>

            <button class="profile" onclick="showMessage('Профиль')">
                <img src="images/profile.png" alt="Profile">
            </button>
        </div>
    </header>

    <div class="layout">

        <aside class="sidebar">
            <h3>МЕНЮ</h3>

            <button class="menu-item active" onclick="showSection('Главная')">
                <img src="images/gento.png" alt="">
                ЕНТ
            </button>

            <button class="menu-item" onclick="showSection('Госэкзамены')">
                <img src="images/exams.png" alt="">
                Госэкзамены
            </button>

            <button class="menu-item" onclick="showSection('Курсы')">
                <img src="images/courses.png" alt="">
                Курсы
            </button>

            <button class="menu-item" onclick="showSection('Помощь')">
                <img src="images/help.png" alt="">
                Помощь
            </button>
        </aside>

        <main class="main">

            <h1 id="section-title">Главная</h1>
            <p>Добро пожаловать на образовательную платформу!</p>

            <div class="cards">

                <div class="card">
                    <h2>ЕНТ</h2>
                    <p>Подготовка к экзамену</p>
                    <button onclick="showMessage('ЕНТ')">
                        Перейти
                    </button>
                </div>

                <div class="card">
                    <h2>Госэкзамены</h2>
                    <p>Подготовка к государственным экзаменам</p>
                    <button onclick="showMessage('Госэкзамены')">
                        Перейти
                    </button>
                </div>

                <div class="card">
                    <h2>Курсы</h2>
                    <p>Образовательные курсы</p>
                    <button onclick="showMessage('Курсы')">
                        Перейти
                    </button>
                </div>

            </div>

        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
