<html>
    <head> <title>С 8 марта!</title>
        <style>
            .ship {
                position: absolute;
                left: calc(50% - 100px);
                top: calc(50% - 50px);
                width: 15%;
            }
            .heart {
                position: absolute;
                top: 10px;
                left: 10px;
                width: 5%;
            }
        </style>
        <script>
        window.onload = function() {
      const img = document.getElementById("heart");

      // Get viewport size
      const maxX = window.innerWidth - 2*img.width;
      const maxY = window.innerHeight - 2*img.height;

      // Generate random coordinates
      const randomX = Math.floor(Math.random() * maxX);
      const randomY = Math.floor(Math.random() * maxY);

      // Apply position
      img.style.left = randomX + "px";
      img.style.top = randomY + "px";
    };
    document.addEventListener("keydown", function(event) {
  if (event.key === "ArrowRight") {
    const sail = document.getElementById("ship");
    let posX = sail.getBoundingClientRect().left;
    const maxX = window.innerWidth - sail.width;
    sail.style.transform = "scaleX(1)"

    if (posX + 10 < maxX) {
      posX += 10;
    } else {
      posX = maxX;
    }

    sail.style.left = posX + "px";
    checkCollision()

  }
  if (event.key === "ArrowLeft") {
    const sail = document.getElementById("ship");
    let posX = sail.getBoundingClientRect().left;
    sail.style.transform = "scaleX(-1)"

    if (posX - 10 > 0) {
      posX -= 10;
    } else {
      posX = 0;
    }
    sail.style.left = posX + "px";
    checkCollision()

    }
if (event.key === "ArrowUp") {
    const sail = document.getElementById("ship");
    let posY = sail.getBoundingClientRect().top;
    const maxY = window.innerHeight - sail.height;

    if (posY - 10 > 0) {
      posY -= 10;
    } else {
      posY = 0;
    }

    sail.style.top = posY + "px";
    checkCollision()

  }
  if (event.key === "ArrowDown") {
    const sail = document.getElementById("ship");
    let posY = sail.getBoundingClientRect().top;
    const maxY = window.innerHeight - sail.height;

    if (posY + 10 < maxY) {
      posY += 10;
    } else {
      posY = maxY;
    }

    sail.style.top = posY + "px";
    checkCollision()

  }
});
let found = false;

    function checkCollision() {
    if (found) return;
    const ship = document.getElementById("ship");
    const heart = document.getElementById("heart");

    const shipRect = ship.getBoundingClientRect();
    const heartRect = heart.getBoundingClientRect();

    const shipCenterX = shipRect.left + shipRect.width / 2;
    const shipCenterY = shipRect.top + shipRect.height / 2;

    const heartCenterX = heartRect.left + heartRect.width / 2;
    const heartCenterY = heartRect.top + heartRect.height / 2;

    const dx = shipCenterX - heartCenterX;
    const dy = shipCenterY - heartCenterY;

    const distance = Math.sqrt(dx*dx + dy*dy);

    if (distance < 50) {
        found = true;
const sound = new Audio("mama.ogg");
sound.play();
setTimeout(() => location.reload(), 2700);

    }
}

    </script>

    </head>
    <body style="
    background-image: url(sea.jpg);
    background-size: cover;">
     <img src="ship.png" class="ship" id="ship">
     <img src="love.png" id="heart" class="heart">
    </body>
</html>
